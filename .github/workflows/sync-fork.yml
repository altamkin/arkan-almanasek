name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 3 * * *'   # يشتغل يوميًا الساعة 3 فجرًا UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream and merge
        run: |
          git remote add upstream https://github.com/roabaot/arkan-almanasek.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
